name: Build ZAGROS SAT APK

# كل push على main بيبني APK جديد. وبتقدر تشغّله يدوي من تبويب Actions → Run workflow.
on:
  push:
    branches: [main]
    # تغيير الإعلانات ما بيحتاج بناء جديد
    paths-ignore: ["ads/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zagros-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ibo-app
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest فيه Android SDK جاهز؛ Gradle بينزّل الناقص لحاله.
      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      # مفتاح التوقيع الثابت (Secrets). بدونه بيتوقّع بمفتاح مؤقت وما بينفع كتحديث.
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.BRAND_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            # Accolé depuis le chat : on enlève espaces et retours à la ligne avant de décoder.
            printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/brand.jks"
            echo "BRAND_KEYSTORE=$RUNNER_TEMP/brand.jks" >> "$GITHUB_ENV"
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::BRAND_KEYSTORE_B64 secret is missing — APK signed with a temporary debug key."
          fi

      - name: Build
        env:
          BRAND_KEYSTORE_PASSWORD: ${{ secrets.BRAND_KEYSTORE_PASSWORD }}
          BRAND_KEY_ALIAS: ${{ secrets.BRAND_KEY_ALIAS }}
          BRAND_KEY_PASSWORD: ${{ secrets.BRAND_KEY_PASSWORD }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          MSG_TOPIC: ${{ secrets.MSG_TOPIC }}
        run: |
          # Secrets collés à la main : on enlève les espaces / retours à la ligne en trop.
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          export BRAND_KEYSTORE_PASSWORD="$(trim "$BRAND_KEYSTORE_PASSWORD")" BRAND_KEY_ALIAS="$(trim "$BRAND_KEY_ALIAS")" BRAND_KEY_PASSWORD="$(trim "$BRAND_KEY_PASSWORD")"
          TMDB_KEY="$(trim "$TMDB_KEY")"; MSG_TOPIC="$(trim "$MSG_TOPIC")"
          chmod +x gradlew
          mkdir -p ../out
          VERSION=$(cat ../VERSION)
          ./gradlew assembleRelease -PBRAND_TMDB_KEY="$TMDB_KEY" -PBRAND_MSG_TOPIC="$MSG_TOPIC" --console=plain --stacktrace
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -E 's/^app-//; s/-release.*//')
            cp "$f" "../out/ZAGROS-SAT-$VERSION-$abi.apk"
          done
          ls -la ../out

      # ريليز: مع كل بناء ناجح على main، باسم الإصدار من ملف VERSION (مثلاً v1.2.78). إذا موجود بيتحدّث.
      # ZAGROS-SAT.apk اسمه ثابت، فرابط التحميل المباشر ما بيتغيّر:
      # https://github.com/<owner>/<repo>/releases/latest/download/ZAGROS-SAT.apk
      # بدون مفتاح التوقيع ما بننشر ريليز (نسخة بمفتاح مؤقت ما بتنفع كتحديث للزباين).
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          mkdir -p release
          cp out/ZAGROS-SAT-*-universal.apk release/ZAGROS-SAT.apk
          # نسخة وحدة بس بالريليز: ZAGROS-SAT.apk بتشتغل على كل الأجهزة (جوال، شاشة، بوكس، تابلت أندرويد).
          # update.json : lu par l'application pour proposer la mise à jour (versionCode = x*10000 + y*100 + z).
          IFS=. read -r MA MI PA < VERSION
          CODE=$((MA * 10000 + MI * 100 + PA))
          SHA=$(sha256sum release/ZAGROS-SAT.apk | cut -d' ' -f1)
          SIZE=$(stat -c %s release/ZAGROS-SAT.apk)
          # ملاحظات الإصدار (بتطلع للزبون بنافذة التحديث): ملف ibo-app/update-notes.txt
          CODE="$CODE" SHA="$SHA" SIZE="$SIZE" TAG="$TAG" python3 - <<'PY'
          import json, os
          v = open("VERSION").read().strip()
          notes = open("ibo-app/update-notes.txt", encoding="utf-8").read().strip() if os.path.exists("ibo-app/update-notes.txt") else ""
          data = {
              "versionCode": os.environ["CODE"], "versionName": v,
              "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}/ZAGROS-SAT.apk",
              "sha256": os.environ["SHA"], "size": os.environ["SIZE"], "notes": notes,
          }
          open("release/update.json", "w", encoding="utf-8").write(json.dumps(data, ensure_ascii=False))
          PY
          cat release/update.json
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/ZAGROS-SAT.apk release/update.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/ZAGROS-SAT.apk release/update.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "ZAGROS SAT $TAG" \
              --notes "تطبيق ZAGROS SAT. للتحميل المباشر: ZAGROS-SAT.apk (بيشتغل على كل الأجهزة)." \
              --latest
          fi
          # تنظيف: بكل الريليزات بيضل ZAGROS-SAT.apk و update.json بس.
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName'); do
            for a in $(gh release view "$t" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
              case "$a" in ZAGROS-SAT.apk|update.json) ;; *) gh release delete-asset "$t" "$a" --repo "$GITHUB_REPOSITORY" -y ;; esac
            done
          done

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zagros-sat-apk
          path: out/*.apk
          retention-days: 30
